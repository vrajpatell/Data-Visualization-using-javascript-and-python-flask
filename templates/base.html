<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Earthquake Monitor{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">{% block head %}{% endblock %}</head><body><nav class="nav"><a class="brand" href="/dashboard">🌎 QuakeRisk</a><a href="/dashboard">Dashboard</a><a href="/map">2D Map</a><a href="/globe">3D Globe</a><a href="/forecast">Forecast</a><a href="/about">About</a><button id="themeToggle" class="ghost">Toggle theme</button></nav><main>{% block content %}{% endblock %}</main><script>document.getElementById('themeToggle')?.addEventListener('click',()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'});</script>{% block scripts %}{% endblock %}</body></html>
