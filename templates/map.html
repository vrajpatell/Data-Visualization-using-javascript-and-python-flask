{% extends 'base.html' %}{% block title %}Earthquake Map{% endblock %}{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>{% endblock %}{% block content %}<section class="hero"><div><h1>2D Earthquake Map</h1><p class="muted">Markers are sized and colored by magnitude. Use the viewport button to query map bounds.</p></div></section><section class="card controls"><div><label>Min magnitude</label><input id="mag" type="number" value="1" step=".1"></div><div><label>Feed</label><select id="feed"><option value="day">Day</option><option value="7day">7 days</option><option value="30day">30 days</option><option value="m4.5">M4.5+</option></select></div><button id="load">Load</button><button id="bounds">Filter to viewport</button><div id="status" class="muted"></div></section><div id="map"></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/map.js') }}"></script>{% endblock %}
