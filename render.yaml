services:
  - type: web
    name: live-earthquake-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: CACHE_TTL_SECONDS
        value: 300
      - key: DEFAULT_FEED_WINDOW
        value: day
      - key: ENABLE_BOOTSTRAP_DATA
        value: true
      - key: ENABLE_MODEL_TRAINING_ON_STARTUP
        value: false
      - key: MAX_API_LIMIT
        value: 2000
